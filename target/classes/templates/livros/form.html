<!DOCTYPE html>
<html lang = "pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Livro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<h1>Cadastrar Livro</h1>
<form th:action="@{/livros/salvar}" th:object="${livro}" method="post">
    <!-- Campo oculto para o ID -->
    <input type="hidden" th:field="*{id}" />

    <label>Título:</label>
    <input type="text" th:field="*{titulo}" /><br/>

    <label for="autor">Autor:</label>
    <input id="autor" type="text" th:field="*{autor}" /><br/>

    <label>Ano de Publicação:</label>
    <input type="number" th:field="*{anoPublicacao}" /><br/>

    <label>Categoria:</label>
    <input type="text" th:field="*{categoria}" /><br/>

    <button type="submit">Salvar</button>
</form>
<a th:href="@{/livros}">Voltar para lista</a>
</body>
</html>
