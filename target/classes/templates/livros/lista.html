<!DOCTYPE html>
<html lang = "pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Livros</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Livros</h1>
    <a th:href="@{/livros/novo}">Novo Livro</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Ano</th>
            <th>Categoria</th>
            <th>Ações</th>
        </tr>
        <tr th:each="livro : ${livros}">
            <td th:text="${livro.id}"></td>
            <td th:text="${livro.titulo}"></td>
            <td th:text="${livro.autor}"></td>
            <td th:text="${livro.anoPublicacao}"></td>
            <td th:text="${livro.categoria}"></td>

            <td>
                <a th:href="@{/livros/editar/{id}(id=${livro.id})}">Editar</a>
                <a th:href="@{/livros/excluir/{id}(id=${livro.id})}">Excluir</a>
            </td>

        </tr>
    </table>
</body>
</html>
