<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Libreoteca</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="auth-container">
        <h2>Criar uma Conta</h2>

        <div class="erro" th:if="${erro}">
            <span th:text="${erro}">Erro no cadastro</span>
        </div>

        <form th:action="@{/usuarios/cadastro}" method="POST">
            <div class="form-group">
                <label>Nome:</label>
                <input type="text" name="nome" required placeholder="Digite seu nome completo">
            </div>
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" name="email" required placeholder="Digite seu e-mail">
            </div>
            <div class="form-group">
                <label>Senha:</label>
                <input type="password" name="senha" required placeholder="Crie uma senha">
            </div>
            <button type="submit">Cadastrar</button>
        </form>

        <p>Já possui uma conta? <a th:href="@{/usuarios/login}">Faça login aqui</a></p>
    </div>
</body>
</html>
