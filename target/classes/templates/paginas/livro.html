<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${livro.titulo}">Detalhes do Livro</title>
    <link rel="stylesheet" th:href="@{/css/livro.css}">
</head>
<body>

    <div class="container-detalhes">
        <div class="capa-container">
            <img th:src="${livro.capaUrl}" alt="Capa do Livro">
        </div>

        <div class="info-container">
            <h1 th:text="${livro.titulo}">Título</h1>
            <p><strong>Autor:</strong> <span th:text="${livro.autor}"></span></p>
            <p><strong>Categoria:</strong> <span th:text="${livro.categoria}"></span></p>
            <p><strong>Ano:</strong> <span th:text="${livro.anoPublicacao}"></span></p>
            
            <p><strong>Preço:</strong> 
                <span th:if="${livro.preco < 0.01}" style="color: #01875f; font-weight: bold;">Gratuito</span>
                <span th:unless="${livro.preco < 0.01}" th:text="${'R$ ' + #numbers.formatDecimal(livro.preco, 1, 'POINT', 2, 'COMMA')}"></span>
            </p>

            <div th:if="${livro.preco < 0.01}">
                <a th:href="${livro.downloadUrl}" target="_blank" class="btn-acao">📥 Baixar PDF Gratuito</a>
            </div>
            <div th:unless="${livro.preco < 0.01}">
                <a th:href="@{/carrinho/adicionar/{id}(id=${livro.id})}" class="btn-acao">💳 Adicionar ao Carrinho</a>
            </div>

            <div th:if="${session.usuarioLogado != null && session.usuarioLogado.role.name() == 'ADMIN'}" style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee;">
                <form th:action="@{/livros/deletar/{id}(id=${livro.id})}" method="post" onsubmit="return confirm('Tem certeza que deseja excluir este livro?');">
                    <button type="submit" style="background-color: #d93025; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                        🗑️ Excluir Livro do Sistema
                    </button>
                </form>
            </div>

            <p style="margin-top: 30px;">
                <a th:href="@{/}" style="color: #666; text-decoration: none;">⬅ Voltar para a loja</a>
            </p>
        </div>
    </div>
</body>
</html>
