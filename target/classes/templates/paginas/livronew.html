<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Livro</title>
    <link rel="stylesheet" th:href="@{/css/livro.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <div class="container-detalhes">
        <div class="capa-container" style="background: #eee; height: 400px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
            <p style="color: #999;">Prévia da Capa</p>
        </div>

        <div class="info-container">
            <h2>Cadastrar Novo Livro</h2>
            <form th:action="@{/livros/novo}" method="POST">
                <div class="form-group"><label>Título:</label><input type="text" name="titulo" required></div>
                <div class="form-group"><label>Autor:</label><input type="text" name="autor" required></div>
                <div class="form-group"><label>Ano:</label><input type="number" name="anoPublicacao" required></div>
                <div class="form-group"><label>Preço:</label><input type="number" step="0.01" name="preco" required></div>
                
                <div class="form-group">
                    <label>Categoria:</label>
                    <input type="text" name="categoria" list="cat-list" required placeholder="Digite uma categoria...">
                    <datalist id="cat-list">
                        <option th:each="cat : ${categorias}" th:value="${cat}"></option>
                    </datalist>
                </div>

                <div class="form-group"><label>URL Capa:</label><input type="url" name="capaUrl" required></div>
                <div class="form-group"><label>URL PDF:</label><input type="url" name="downloadUrl" required></div>
                <button type="submit" class="btn-acao">Salvar Livro</button>
            </form>
            
            <p style="margin-top: 20px;"><a th:href="@{/}">⬅ Voltar para a Página Inicial</a></p>
        </div>
    </div>
</body>
</html>
