<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu Carrinho de Compras</title>
    <link rel="stylesheet" th:href="@{/css/livro.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <div class="container-detalhes">
        <h2>Seu Carrinho de Compras</h2>

        <div th:if="${itens == null || itens.isEmpty()}">
            <p>Seu carrinho está vazio no momento.</p>
            <p><a th:href="@{/}">⬅ Voltar para a Vitrine</a></p>
        </div>

        <div th:if="${itens != null && !itens.isEmpty()}">
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                <thead>
                    <tr style="border-bottom: 2px solid #eee;">
                        <th style="text-align: left; padding: 10px;">Livro</th>
                        <th style="text-align: left; padding: 10px;">Autor</th>
                        <th style="text-align: right; padding: 10px;">Preço</th>
                        <th style="text-align: center; padding: 10px;">Ação</th> </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${itens}" style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;" th:text="${item.titulo}">Título</td>
                        <td style="padding: 10px;" th:text="${item.autor}">Autor</td>
                        <td style="padding: 10px; text-align: right;" 
                            th:text="${'R$ ' + #numbers.formatDecimal(item.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                        <td style="padding: 10px; text-align: center;">
                            <a th:href="@{/carrinho/remover/{id}(id=${item.id})}" 
                               style="color: #dc3545; text-decoration: none; font-weight: bold;">Remover</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p style="font-size: 1.3em; text-align: right; color: #333;">
                <strong>Total: </strong> 
                <span th:text="${'R$ ' + #numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
            </p>

            <form th:action="@{/carrinho/checkout}" method="POST" 
                  style="margin-top: 25px; padding: 20px; background: #f1f8f4; border-radius: 8px; border: 1px solid #d1e7dd;">
                
                <h3 style="margin-top: 0; color: #01875f;">Finalizar Compra</h3>
                
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">E-mail para receber os PDFs:</label>
                    <input type="email" name="emailDestino" th:value="${session.usuarioLogado.email}" required 
                           style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                </div>
                
                <button type="submit" 
                        style="width: 100%; padding: 14px; background: #01875f; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em;">
                    Confirmar Compra (Simulado)
                </button>
            </form>

            <p style="margin-top: 20px;"><a th:href="@{/}">⬅ Continuar comprando</a></p>
        </div>
    </div>

</body>
</html>
